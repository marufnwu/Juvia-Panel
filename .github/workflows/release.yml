name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install cross-compiler (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Go Binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          cd backend
          go build -ldflags="-s -w -X panel-api/internal/config.Version=${{ github.ref_name }}" -o ../build/juvia-api-linux-${{ matrix.arch }} ./cmd/api
          go build -ldflags="-s -w -X panel-api/internal/config.Version=${{ github.ref_name }}" -o ../build/juvia-agent-linux-${{ matrix.arch }} ./cmd/agent
          go build -ldflags="-s -w -X panel-api/internal/config.Version=${{ github.ref_name }}" -o ../build/juvia-cli-linux-${{ matrix.arch }} ./cmd/debug

      - name: Build Frontend
        if: matrix.arch == 'amd64'
        run: cd frontend && npm install --legacy-peer-deps && npm run build

      - name: Package Frontend
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p build
          cd frontend/out
          tar -czf ../../build/juvia-ui.tar.gz .

      - name: Copy Migrations
        run: |
          mkdir -p build/migrations
          cp backend/migrations/*.sql build/migrations/

      - name: Copy Scripts
        run: |
          mkdir -p build/scripts
          cp scripts/install.sh build/scripts/
          cp scripts/uninstall.sh build/scripts/
          cp scripts/update.sh build/scripts/
          cp scripts/reset.sh build/scripts/
          cp scripts/juvia build/scripts/

      - name: Copy Caddyfile
        run: |
          mkdir -p build/config
          cp backend/config/Caddyfile build/config/

      - name: Package Release Bundle
        run: |
          cd build
          tar -czf juvia-release-${{ matrix.arch }}.tar.gz \
            juvia-api-linux-${{ matrix.arch }} \
            juvia-agent-linux-${{ matrix.arch }} \
            juvia-cli-linux-${{ matrix.arch }} \
            juvia-ui.tar.gz \
            migrations/ \
            scripts/ \
            config/

      - name: Generate Checksums
        run: |
          cd build
          sha256sum juvia-api-linux-${{ matrix.arch }} juvia-agent-linux-${{ matrix.arch }} juvia-cli-linux-${{ matrix.arch }} juvia-release-${{ matrix.arch }}.tar.gz > checksums-${{ matrix.arch }}.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            build/juvia-api-linux-${{ matrix.arch }}
            build/juvia-agent-linux-${{ matrix.arch }}
            build/juvia-cli-linux-${{ matrix.arch }}
            build/checksums-${{ matrix.arch }}.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: build/juvia-release-${{ matrix.arch }}.tar.gz

      - name: Upload UI
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: juvia-ui
          path: build/juvia-ui.tar.gz

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.txt
            release-assets/**/juvia-api-linux-*
            release-assets/**/juvia-agent-linux-*
            release-assets/**/juvia-cli-linux-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
