name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install cross-compiler (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build API Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-api ./cmd/api

      - name: Build Agent Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-agent ./cmd/agent

      - name: Build CLI Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-cli ./cmd/debug

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package Frontend
        run: |
          mkdir -p build
          cd frontend/.next/standalone
          tar -czf ../../build/juvia-ui.tar.gz .

      - name: Copy Migrations
        run: |
          mkdir -p build/migrations
          cp backend/migrations/*.sql build/migrations/
          cp scripts/migrations/*.sql build/migrations/ 2>/dev/null || true

      - name: Copy Scripts
        run: |
          mkdir -p build/scripts
          cp scripts/install.sh build/scripts/
          cp scripts/uninstall.sh build/scripts/
          cp scripts/update.sh build/scripts/

      - name: Copy Caddyfile
        run: |
          mkdir -p build/config
          cp backend/config/Caddyfile build/config/

      - name: Package Release Bundle
        run: |
          cd build
          tar -czf juvia-release-${{ matrix.arch }}.tar.gz migrations/ scripts/ config/

      - name: Generate Checksums
        run: |
          cd build
          sha256sum juvia-api juvia-agent juvia-cli juvia-ui.tar.gz juvia-release-${{ matrix.arch }}.tar.gz > checksums-${{ matrix.arch }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: |
            build/juvia-api
            build/juvia-agent
            build/juvia-cli
            build/juvia-ui.tar.gz
            build/juvia-release-${{ matrix.arch }}.tar.gz
            build/checksums-${{ matrix.arch }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.txt
            release-assets/build-amd64/juvia-api
            release-assets/build-amd64/juvia-agent
            release-assets/build-amd64/juvia-cli
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint
