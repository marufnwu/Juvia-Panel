name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build API Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-api ./cmd/api

      - name: Build Agent Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-agent ./cmd/agent

      - name: Build CLI Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/juvia-cli ./cmd/debug

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Install ESLint
        run: cd frontend && npm install --save-dev eslint

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package Frontend
        run: |
          cd frontend
          tar -czf ../build/juvia-ui.tar.gz .next/

      - name: Copy Migrations
        run: |
          mkdir -p build/migrations
          cp backend/migrations/*.sql build/migrations/
          cp scripts/migrations/*.sql build/migrations/ 2>/dev/null || true

      - name: Copy Scripts
        run: |
          mkdir -p build/scripts
          cp scripts/install.sh build/scripts/
          cp scripts/uninstall.sh build/scripts/
          cp scripts/update.sh build/scripts/

      - name: Package Release Bundle
        run: |
          cd build
          tar -czf juvia-release.tar.gz migrations/ scripts/

      - name: Generate Checksums
        run: |
          cd build
          sha256sum juvia-api juvia-agent juvia-cli juvia-ui.tar.gz juvia-release.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/juvia-api
            build/juvia-agent
            build/juvia-cli
            build/juvia-ui.tar.gz
            build/juvia-release.tar.gz
            build/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint