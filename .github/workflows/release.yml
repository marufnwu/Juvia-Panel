name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build API Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/panel-api ./cmd/api

      - name: Build Agent Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/panel-agent ./cmd/agent

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package Frontend
        run: |
          cd frontend
          tar -czf ../build/panel-ui.tar.gz out/

      - name: Copy Migrations
        run: |
          mkdir -p build/migrations
          cp backend/migrations/*.sql build/migrations/

      - name: Package Migrations
        run: |
          cd build
          tar -czf panel-migrations.tar.gz migrations/

      - name: Generate Checksums
        run: |
          cd build
          sha256sum panel-api panel-agent panel-ui.tar.gz panel-migrations.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/panel-api
            build/panel-agent
            build/panel-ui.tar.gz
            build/panel-migrations.tar.gz
            build/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint